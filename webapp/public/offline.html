<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B5FFF" />
    <title>Offline — EventHub</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fafafa;
        color: #16171a;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(43, 95, 255, 0.07);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: linear-gradient(135deg, #2b5fff 0%, #9f44c4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.5px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 26px;
        font-weight: 700;
      }
      p {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 21px;
        font-weight: 500;
        color: #6b7280;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 24px;
      }
      button,
      a {
        height: 44px;
        padding: 0 20px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: filter 200ms ease;
      }
      button {
        border: none;
        background: #2b5fff;
        color: #ffffff;
      }
      button:hover {
        filter: brightness(0.95);
      }
      a {
        background: #f3f4f6;
        color: #16171a;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">EH</div>
      <h1>You are offline</h1>
      <p>
        EventHub stores your events, tickets and chats on this device, so everything you already
        have stays available. Reconnect to fetch new content.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="./home">Open EventHub</a>
      </div>
    </main>
  </body>
</html>
