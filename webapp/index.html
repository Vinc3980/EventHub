    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>EventHub</title>
    <script>
      // GitHub Pages has no SPA fallback: public/404.html bounces deep links
      // back to index.html with the intended URL in ?redirect= (see that file).
      // Restore it before the router boots. No-op at the domain root and in dev.
      (function () {
        var redirect = new URLSearchParams(window.location.search).get('redirect');
        if (redirect && redirect.charAt(0) === '/' && redirect.charAt(1) !== '/') {
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
